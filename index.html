<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CROWN JOGGERS · coming soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ─── GOLDEN YELLOW BACKGROUND ─── */
            background: radial-gradient(ellipse at center, #f9d423 0%, #f4b400 60%, #e69100 100%);
            font-family: 'Share Tech Mono', monospace;
            padding: 1.5rem;
            position: relative;
        }

        /* subtle overlay for depth (not scanline here, to keep background clean) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.03) 0px,
                    rgba(0, 0, 0, 0.03) 2px,
                    transparent 2px,
                    transparent 8px);
            pointer-events: none;
            z-index: 1;
        }

        /* ─── Main Card ─── */
        .container {
            max-width: 780px;
            width: 100%;
            background: rgba(10, 10, 18, 0.88);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.25), inset 0 0 80px rgba(255, 215, 0, 0.03);
            padding: 3.5rem 2.5rem;
            border-radius: 40px;
            text-align: center;
            position: relative;
            z-index: 5;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
            animation: borderGlow 3.5s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0% { border-color: rgba(255, 215, 0, 0.25); box-shadow: 0 0 60px rgba(255, 215, 0, 0.10); }
            50% { border-color: rgba(255, 215, 0, 0.7); box-shadow: 0 0 100px rgba(255, 215, 0, 0.30); }
            100% { border-color: rgba(255, 215, 0, 0.25); box-shadow: 0 0 60px rgba(255, 215, 0, 0.10); }
        }

        .container:hover {
            box-shadow: 0 0 120px rgba(255, 215, 0, 0.35);
        }

        /* ─── Crown Emoji (floating) ─── */
        .crown-icon {
            font-size: clamp(3rem, 7vw, 4.5rem);
            display: block;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* ─── Title: CROWN JOGGERS ─── */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(2.8rem, 12vw, 5.2rem);
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #ffe066, #ffd700, #f4a900);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.3), 0 0 120px rgba(255, 215, 0, 0.1);
            line-height: 1.1;
            margin-bottom: 0.5rem;
        }

        /* ─── Subtitle / Description ─── */
        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: #e6d5b8;
            letter-spacing: 0.04em;
            max-width: 600px;
            margin: 0 auto 2.8rem auto;
            line-height: 1.6;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            padding-bottom: 1.8rem;
        }

        .subtitle span {
            color: #ffd700;
            font-weight: 700;
        }

        /* ─── Download Button (coming soon) ─── */
        .btn-download {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            background: linear-gradient(135deg, #ffd700, #f4a900);
            color: #0a0a12;
            padding: 1.2rem 3.5rem;
            border: none;
            border-radius: 80px;
            letter-spacing: 0.12em;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.25), inset 0 2px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.25s ease;
            cursor: default;
            display: inline-block;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-download:hover {
            transform: scale(1.04);
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #ffe066, #f4a900);
        }

        .btn-download:active {
            transform: scale(0.96);
        }

        /* small "coming soon" badge inside the button */
        .btn-download .badge {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            background: rgba(0, 0, 0, 0.15);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            margin-left: 0.6rem;
            vertical-align: middle;
            color: #2a2000;
        }

        /* ─── Footer / extra flair ─── */
        .footer-note {
            margin-top: 2.8rem;
            font-size: 0.65rem;
            color: rgba(255, 215, 0, 0.25);
            letter-spacing: 0.15em;
            font-family: 'Orbitron', sans-serif;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            .container {
                padding: 2.2rem 1.2rem;
                border-radius: 28px;
            }
            .btn-download {
                padding: 1rem 1.8rem;
                font-size: 1rem;
                width: 100%;
            }
            .btn-download .badge {
                font-size: 0.5rem;
                margin-left: 0.3rem;
            }
            .subtitle {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Crown Icon -->
        <span class="crown-icon">👑</span>

        <!-- Main Title -->
        <h1 class="main-title">CROWN JOGGERS</h1>

        <!-- Description / Subtitle -->
        <p class="subtitle">
            Dash, dodge, and conquer in a royal race for the crown.<br />
            <span>🏃‍♂️ The ultimate parkour runner awaits.</span>
        </p>

        <!-- Download Button (coming soon) -->
        <div class="btn-download">
            download
            <span class="badge">coming soon</span>
        </div>

        <div class="footer-note">✦ crown joggers · 2026 ✦</div>

    </div>

    <!-- (no extra script needed – static but polished) -->
</body>
</html>
